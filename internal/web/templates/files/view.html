{{define "content"}}
<div>
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:0.5rem;margin-bottom:0.75rem;">
    <div style="display:flex;align-items:center;gap:0.35rem;">
      <i data-lucide="layers" style="width:12px;height:12px;color:#6b7280;"></i>
      <span style="font-size:0.72rem;color:#9ca3af;">{{.File.Namespace}}</span>
    </div>
    <span style="color:#2e2e38;">·</span>
    {{if eq (printf "%s" .File.Mode) "sync"}}
      <span class="badge badge-sync">sync</span>
    {{else}}
      <span class="badge badge-backup">backup</span>
    {{end}}
    <span style="color:#2e2e38;">·</span>
    <div style="display:flex;align-items:center;gap:0.35rem;">
      <i data-lucide="clock" style="width:12px;height:12px;color:#6b7280;"></i>
      <span style="font-size:0.72rem;color:#6b7280;">{{formatTime .File.LastSyncAt}}</span>
    </div>
  </div>

  {{if .Error}}
  <div class="alert-danger" style="margin-bottom:1rem;display:flex;align-items:center;gap:0.75rem;">
    <i data-lucide="alert-circle" style="width:14px;height:14px;flex-shrink:0;"></i>
    <span style="font-size:0.8rem;">{{.Error}}</span>
  </div>
  {{else}}
  <div class="card" style="padding:0;overflow:hidden;">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:0.5rem 0.75rem;border-bottom:1px solid #1e1e24;">
      <div style="display:flex;align-items:center;gap:0.4rem;">
        <i data-lucide="file-code" style="width:12px;height:12px;color:#6b7280;"></i>
        <span style="font-size:0.72rem;color:#9ca3af;">Decrypted content</span>
      </div>
      <button
        onclick="copyContent()"
        class="btn btn-secondary btn-sm"
        id="copy-btn"
      >
        <i data-lucide="copy" style="width:11px;height:11px;"></i>
        Copy
      </button>
    </div>
    <pre id="file-content" style="border:none;border-radius:0;margin:0;max-height:520px;overflow-y:auto;font-size:0.75rem;">{{.Content}}</pre>
  </div>
  {{end}}
</div>

<script>
function copyContent() {
  var el = document.getElementById('file-content');
  if (!el) return;
  navigator.clipboard.writeText(el.textContent).then(function() {
    var btn = document.getElementById('copy-btn');
    var orig = btn.innerHTML;
    btn.innerHTML = '<i data-lucide="check" style="width:11px;height:11px;"></i> Copied';
    if (window.lucide) lucide.createIcons({ nodes: [btn] });
    setTimeout(function() { btn.innerHTML = orig; if (window.lucide) lucide.createIcons({ nodes: [btn] }); }, 2000);
  });
}
</script>
{{end}}
