{{define "login"}}<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="password" content="off">
  <title>Login — DaemonHound</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/basecoat-css@1.0.2/dist/css/nova.min.css">
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <style>
    body { background: #0d0d0f; color: #e2e2e5; font-family: 'Inter', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .login-card { background: #111114; border: 1px solid #1e1e24; border-radius: 0.75rem; padding: 2.5rem 2rem; width: 100%; max-width: 22rem; }
    .form-input { width: 100%; background: #0d0d0f; border: 1px solid #2e2e38; border-radius: 0.375rem; padding: 0.55rem 0.85rem; font-size: 0.875rem; color: #e2e2e5; outline: none; box-sizing: border-box; transition: border-color 0.15s; }
    .form-input:focus { border-color: #1fcb4f; }
    .form-input::placeholder { color: #4b5563; }
    .form-label { font-size: 0.8rem; font-weight: 500; color: #9ca3af; margin-bottom: 0.35rem; display: block; }
    .btn-primary { display: flex; align-items: center; justify-content: center; gap: 0.4rem; width: 100%; padding: 0.55rem; border-radius: 0.375rem; background: #1fcb4f; color: #000; font-size: 0.875rem; font-weight: 600; border: none; cursor: pointer; transition: background 0.15s; }
    .btn-primary:hover { background: #17a33f; }
    .alert-error { background: #2a0f0f; border: 1px solid #7f1d1d; border-radius: 0.375rem; padding: 0.6rem 0.85rem; color: #fca5a5; font-size: 0.8rem; display: flex; align-items: center; gap: 0.5rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <!-- Brand -->
    <div style="text-align:center;margin-bottom:2rem;">
      <img src="/static/logo.png" alt="DaemonHound" style="width:48px;height:48px;border-radius:10px;margin:0 auto 0.75rem;display:block;object-fit:cover;">
      <h1 style="font-size:1.25rem;font-weight:700;color:#f3f4f6;letter-spacing:-0.01em;">DaemonHound</h1>
      <p style="font-size:0.8rem;color:#6b7280;margin-top:0.25rem;">Enter your master password to unlock</p>
    </div>

    {{if .Error}}
    <div class="alert-error" style="margin-bottom:1.25rem;">
      <i data-lucide="alert-circle" style="width:14px;height:14px;flex-shrink:0;"></i>
      {{.Error}}
    </div>
    {{end}}

    <form method="POST" action="/login">
      <input type="hidden" name="next" value="{{.Next}}">

      <div style="margin-bottom:1.25rem;">
        <label class="form-label" for="password">Password</label>
        <div style="position:relative;">
          <input
            id="password"
            class="form-input"
            type="password"
            name="password"
            autocomplete="current-password"
            placeholder="Master password"
            autofocus
            required
            style="padding-right:2.5rem;"
          >
          <button
            type="button"
            onclick="togglePwd()"
            tabindex="-1"
            style="position:absolute;right:0.65rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#4b5563;padding:0;display:flex;align-items:center;"
            aria-label="Toggle password visibility"
          >
            <i id="eye-icon" data-lucide="eye" style="width:15px;height:15px;"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary">
        <i data-lucide="unlock" style="width:15px;height:15px;"></i>
        Unlock
      </button>
    </form>

    <p style="text-align:center;margin-top:1.5rem;font-size:0.72rem;color:#374151;">
      Session expires after 12 hours
    </p>
  </div>

  <script>
    function togglePwd() {
      const inp = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (inp.type === 'password') {
        inp.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        inp.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      if (window.lucide) lucide.createIcons({ nodes: [icon] });
    }
    document.addEventListener('DOMContentLoaded', function() { if (window.lucide) lucide.createIcons(); });
    window.addEventListener('load', function() { if (window.lucide) lucide.createIcons(); });
  </script>
</body>
</html>
{{end}}
