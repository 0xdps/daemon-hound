name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write
  deployments: write

jobs:
  macos-release:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Import release GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Prepare Apple signing assets
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/macos-signing.p12"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.MACOS_NOTARY_KEY_ID }}.p8"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$MACOS_NOTARY_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild -T /usr/bin/xcrun
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "MACOS_NOTARY_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build notarized macOS DMG
        env:
          APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
          KEYCHAIN_PATH: ${{ env.KEYCHAIN_PATH }}
          MACOS_NOTARY_KEY_PATH: ${{ env.MACOS_NOTARY_KEY_PATH }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
        run: |
          chmod +x scripts/build-macos-release.sh
          scripts/build-macos-release.sh "${{ matrix.arch }}" "${{ github.ref_name }}"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg

  release:
    needs: macos-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Import release GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: macos-artifacts
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Generate and push Homebrew formula
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"

          # Debug: show what's in each directory
          echo "=== Contents of dist/ (GoReleaser outputs) ==="
          ls -la dist/ || true
          echo "=== Contents of macos-artifacts/ (DMGs) ==="
          ls -la macos-artifacts/ || true
          echo "=== DMG files ==="
          find macos-artifacts -name "*.dmg" -type f 2>/dev/null || true

          # Find DMG files in macos-artifacts (download-artifact may place them in subdirectories)
          X86_DMG=$(find macos-artifacts -name "daemon-hound_${VERSION}_macOS_x86_64.dmg" -type f | head -1)
          ARM_DMG=$(find macos-artifacts -name "daemon-hound_${VERSION}_macOS_arm64.dmg" -type f | head -1)

          if [[ -z "$X86_DMG" || -z "$ARM_DMG" ]]; then
            echo "ERROR: Could not find DMG files in macos-artifacts/"
            echo "Searched for:"
            echo "  daemon-hound_${VERSION}_macOS_x86_64.dmg"
            echo "  daemon-hound_${VERSION}_macOS_arm64.dmg"
            exit 1
          fi

          # Compute SHA256s locally
          DARWIN_X86_TGZ_SHA=$(shasum -a 256 "dist/daemon-hound_${VERSION}_Darwin_x86_64.tar.gz" | awk '{print $1}')
          DARWIN_ARM_TGZ_SHA=$(shasum -a 256 "dist/daemon-hound_${VERSION}_Darwin_arm64.tar.gz" | awk '{print $1}')
          LINUX_X86_TGZ_SHA=$(shasum -a 256 "dist/daemon-hound_${VERSION}_Linux_x86_64.tar.gz" | awk '{print $1}')
          LINUX_ARM_TGZ_SHA=$(shasum -a 256 "dist/daemon-hound_${VERSION}_Linux_arm64.tar.gz" | awk '{print $1}')
          DARWIN_X86_DMG_SHA=$(shasum -a 256 "$X86_DMG" | awk '{print $1}')
          DARWIN_ARM_DMG_SHA=$(shasum -a 256 "$ARM_DMG" | awk '{print $1}')

          echo "SHA256s computed successfully"
          echo "x86_64 DMG: $DARWIN_X86_DMG_SHA"
          echo "arm64 DMG:  $DARWIN_ARM_DMG_SHA"

          # Generate the formula
          RELEASE_URL="https://github.com/0xdps/daemon-hound/releases/download/${TAG}"
          cat > /tmp/daemon-hound.rb <<FORMULA
          # typed: false
          # frozen_string_literal: true

          # This file was generated by the release workflow. DO NOT EDIT.
          class DaemonHound < Formula
            desc "Opinionated local config and secret management for developers"
            homepage "https://github.com/0xdps/daemon-hound"
            version "${VERSION}"
            license "AGPL-3.0"

            on_macos do
              if Hardware::CPU.intel?
                url "${RELEASE_URL}/daemon-hound_${VERSION}_Darwin_x86_64.tar.gz"
                sha256 "${DARWIN_X86_TGZ_SHA}"

                resource "app_bundle" do
                  url "${RELEASE_URL}/daemon-hound_${VERSION}_macOS_x86_64.dmg"
                  sha256 "${DARWIN_X86_DMG_SHA}"
                end
              end
              if Hardware::CPU.arm?
                url "${RELEASE_URL}/daemon-hound_${VERSION}_Darwin_arm64.tar.gz"
                sha256 "${DARWIN_ARM_TGZ_SHA}"

                resource "app_bundle" do
                  url "${RELEASE_URL}/daemon-hound_${VERSION}_macOS_arm64.dmg"
                  sha256 "${DARWIN_ARM_DMG_SHA}"
                end
              end
            end

            on_linux do
              if Hardware::CPU.intel? && Hardware::CPU.is_64_bit?
                url "${RELEASE_URL}/daemon-hound_${VERSION}_Linux_x86_64.tar.gz"
                sha256 "${LINUX_X86_TGZ_SHA}"
              end
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "${RELEASE_URL}/daemon-hound_${VERSION}_Linux_arm64.tar.gz"
                sha256 "${LINUX_ARM_TGZ_SHA}"
              end
            end

            def install
              bin.install "dhd"

              if OS.mac?
                resource("app_bundle").stage do |staging|
                  dmg_file = Dir["*.dmg"].first
                  if dmg_file
                    mount_point = \`hdiutil attach #{dmg_file.shellescape} -nobrowse -readonly 2>&1 | tail -1 | awk '{print \$NF}'\`.strip
                    if mount_point && !mount_point.empty? && File.exist?(mount_point)
                      app_src = File.join(mount_point, "DaemonHound.app")
                      if File.exist?(app_src)
                        prefix.install Dir["#{app_src}"]
                        rm_f bin/"dhd"
                        bin.install_symlink prefix/"DaemonHound.app/Contents/MacOS/dhd" => "dhd"
                      end
                      system "hdiutil", "detach", mount_point
                    end
                  end
                end
              end
            end

            def post_install
              if OS.mac?
                app_bundle = opt_prefix/"DaemonHound.app"
                applications_dir = Pathname.new("~/Applications").expand_path
                if app_bundle.exist? && applications_dir.exist?
                  ln_sf app_bundle, applications_dir/"DaemonHound.app"
                end
              end
            end

            def caveats
              if OS.mac?
                <<~EOS
                  DaemonHound has been installed with the signed app bundle.

                  The signed app bundle is located at:
                    #{opt_prefix}/DaemonHound.app

                  A symlink has been created in your Applications folder:
                    ~/Applications/DaemonHound.app

                  The CLI binary \`dhd\` is symlinked to the signed bundle's executable.
                EOS
              else
                <<~EOS
                  DaemonHound has been installed.

                  Run \`dhd init\` to get started.
                EOS
              end
            end

            test do
              system "#{bin}/dhd", "--version"
            end
          end
          FORMULA

          # Generate the Cask
          cat > /tmp/daemon-hound.rb <<CASK
          cask "daemon-hound" do
            arch arm: "arm64", intel: "x86_64"

            version "${VERSION}"
            sha256 arm:   "${DARWIN_ARM_DMG_SHA}",
                   intel: "${DARWIN_X86_DMG_SHA}"

            url "https://github.com/0xdps/daemon-hound/releases/download/${TAG}/daemon-hound_#{version}_macOS_#{arch}.dmg"
            name "DaemonHound"
            desc "Opinionated local config and secret management for developers"
            homepage "https://github.com/0xdps/daemon-hound"

            app "DaemonHound.app"
            binary "#{appdir}/DaemonHound.app/Contents/MacOS/dhd", target: "dhd"

            zap trash: [
              "~/Library/Application Support/DaemonHound",
              "~/Library/Logs/DaemonHound",
            ]
          end
          CASK

          # Clone the homebrew-packages repo
          git clone --depth 1 "https://x-access-token:${GH_PAT}@github.com/0xdps/homebrew-packages.git" /tmp/homebrew-packages

          # Copy the generated formula and cask
          mkdir -p /tmp/homebrew-packages/Formula
          mkdir -p /tmp/homebrew-packages/Casks
          cp /tmp/daemon-hound.rb /tmp/homebrew-packages/Formula/daemon-hound.rb
          cp /tmp/daemon-hound.rb /tmp/homebrew-packages/Casks/daemon-hound.rb

          # Commit and push
          cd /tmp/homebrew-packages
          git config user.name "goreleaserbot"
          git config user.email "bot@goreleaser.com"
          git add Formula/daemon-hound.rb Casks/daemon-hound.rb
          git diff --cached --quiet || git commit -m "Brew formula and cask update for daemon-hound version ${TAG}"
          git push origin trunk

      - name: Install APT repo dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev gzip coreutils

      - name: Build APT repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APT_GPG_KEY: ${{ secrets.APT_GPG_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          chmod +x scripts/update-apt-repo.sh
          ./scripts/update-apt-repo.sh "${{ github.ref_name }}" _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
